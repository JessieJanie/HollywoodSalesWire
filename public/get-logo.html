<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Download your logo</title>
<style>
  body { font-family: Georgia, serif; background: #FBFBF7; color: #203B2E; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 24px; }
  img { max-width: 80%; border: 1px solid #ddd; background: #fff; padding: 24px; }
  a.btn { background: #203B2E; color: #FBFBF7; padding: 16px 32px; font-size: 20px; text-decoration: none; border-radius: 6px; }
  p { color: #666; font-family: sans-serif; font-size: 14px; }
</style>
</head>
<body>
  <img src="/logo.png" alt="Hollywood Sales Wire logo">
  <a class="btn" href="/logo.png" download="hollywood-sales-wire-logo.png">⬇ Download Logo</a>
  <p>Click the green button — the file will go to your Downloads folder.</p>
</body>
</html>
