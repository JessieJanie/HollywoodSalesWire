openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /subscribe:
    post:
      operationId: subscribe
      tags: [marketing]
      summary: Subscribe to the free preview briefing series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /founding-offer:
    get:
      operationId: foundingOffer
      tags: [marketing]
      summary: Check a subscriber's founding-offer status
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Offer status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundingOfferStatus"
        "404":
          description: Unknown token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/status:
    get:
      operationId: publisherStatus
      tags: [publisher]
      summary: Publisher dashboard status (key-protected)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherStatus"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/draft:
    post:
      operationId: publisherDraft
      tags: [publisher]
      summary: Draft a condensed free-edition teaser from the full Wire text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherDraftInput"
      responses:
        "200":
          description: Drafted teaser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherDraftResult"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/send:
    post:
      operationId: publisherSend
      tags: [publisher]
      summary: Send the weekly free edition to all active subscribers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherSendInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherSendResult"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/paid-send:
    post:
      operationId: publisherPaidSend
      tags: [publisher]
      summary: Send the full paid Wire to all members (once per week)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaidWireSendInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherSendResult"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Already sent this week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/comp-member:
    post:
      operationId: publisherCompMember
      tags: [publisher]
      summary: Add a complimentary member (no Stripe) and send their welcome email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompMemberInput"
      responses:
        "200":
          description: Member added (or already existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompMemberResult"
        "400":
          description: Invalid email or plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/wire/latest:
    get:
      operationId: publisherWireLatest
      tags: [publisher]
      summary: Latest Monday research run (key-protected)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest run (status "none" if never run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireRunStatus"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/reports:
    get:
      operationId: publisherReports
      tags: [publisher]
      summary: List special report upload statuses (key-protected)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherReportsList"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/reports/upload-url:
    post:
      operationId: publisherReportsUploadUrl
      tags: [publisher]
      summary: Get presigned URL for uploading a special report PDF (key-protected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherReportUploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherReportUploadUrlResult"
        "400":
          description: Bad slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/reports/confirm:
    post:
      operationId: publisherReportsConfirm
      tags: [publisher]
      summary: Confirm report upload and trigger pending deliveries (key-protected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherReportConfirmInput"
      responses:
        "200":
          description: Confirmed; deliveredCount = founding members just emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherReportConfirmResult"
        "400":
          description: Bad input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/wire/save:
    patch:
      operationId: publisherWireSave
      tags: [publisher]
      summary: Save edited wire markdown back to the current ready draft (key-protected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherWireSaveInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherWireSaveResult"
        "400":
          description: Bad input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: No ready draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/wire/run:
    post:
      operationId: publisherWireRun
      tags: [publisher]
      summary: Start a research run now (key-protected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherKeyInput"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireRunStarted"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Already running or already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    PublisherKeyInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
    WireRunStarted:
      type: object
      required: [status]
      properties:
        status:
          type: string
    WireSource:
      type: object
      required: [url, label, wordCount, status]
      properties:
        url:
          type: string
        label:
          type: string
        wordCount:
          type: number
        status:
          type: string
        fetchedAt:
          type: string
          description: ISO timestamp of when this source was pulled (absent on runs before Aug 2026)
    WireRunStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
        weekKey:
          type: string
        startedAt:
          type: string
        finishedAt:
          type: string
        error:
          type: string
        wireMarkdown:
          type: string
        freeSubject:
          type: string
        freeBody:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/WireSource"
    PublisherWireSaveInput:
      type: object
      required: [key, wireMarkdown]
      properties:
        key:
          type: string
        wireMarkdown:
          type: string
          minLength: 100
    PublisherWireSaveResult:
      type: object
      required: [weekKey, saved]
      properties:
        weekKey:
          type: string
        saved:
          type: boolean
    PublisherStatus:
      type: object
      required: [subscriberCount, memberCount, paidSentThisWeek]
      properties:
        subscriberCount:
          type: number
        lastSentAt:
          type: string
        lastSubject:
          type: string
        memberCount:
          type: number
        paidSentThisWeek:
          type: boolean
        lastPaidSentAt:
          type: string
        lastPaidSubject:
          type: string
    PaidWireSendInput:
      type: object
      required: [key, subject, bodyText]
      properties:
        key:
          type: string
        subject:
          type: string
          minLength: 3
        bodyText:
          type: string
          minLength: 100
    CompMemberInput:
      type: object
      required: [key, email]
      properties:
        key:
          type: string
        email:
          type: string
          minLength: 5
        plan:
          type: string
          enum: [founding-individual, founding-team, individual, team, member]
          default: founding-individual
    CompMemberResult:
      type: object
      required: [created, welcomed]
      properties:
        created:
          type: boolean
        welcomed:
          type: boolean
    PublisherDraftInput:
      type: object
      required: [key, wireText]
      properties:
        key:
          type: string
        wireText:
          type: string
          minLength: 100
    PublisherDraftResult:
      type: object
      required: [subject, bodyText]
      properties:
        subject:
          type: string
        bodyText:
          type: string
    PublisherSendInput:
      type: object
      required: [key, subject, bodyText]
      properties:
        key:
          type: string
        subject:
          type: string
          minLength: 3
        bodyText:
          type: string
          minLength: 50
    PublisherSendResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: number
    PublisherReport:
      type: object
      required: [slug, title, uploaded]
      properties:
        slug:
          type: string
        title:
          type: string
        uploaded:
          type: boolean
        uploadedAt:
          type: string
    PublisherReportsList:
      type: object
      required: [reports, pendingMemberCount]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/PublisherReport"
        pendingMemberCount:
          type: number
    PublisherReportUploadUrlInput:
      type: object
      required: [key, slug]
      properties:
        key:
          type: string
        slug:
          type: string
    PublisherReportUploadUrlResult:
      type: object
      required: [uploadUrl, slug]
      properties:
        uploadUrl:
          type: string
        slug:
          type: string
    PublisherReportConfirmInput:
      type: object
      required: [key, slug, uploadedUrl]
      properties:
        key:
          type: string
        slug:
          type: string
        uploadedUrl:
          type: string
    PublisherReportConfirmResult:
      type: object
      required: [slug, objectPath, deliveredCount]
      properties:
        slug:
          type: string
        objectPath:
          type: string
        deliveredCount:
          type: number
    FoundingOfferStatus:
      type: object
      required: [active, deadline, deadlineLabel]
      properties:
        active:
          type: boolean
        deadline:
          type: string
        deadlineLabel:
          type: string
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
    SubscribeResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ApiMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
