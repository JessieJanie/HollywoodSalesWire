openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /subscribe:
    post:
      operationId: subscribe
      tags: [marketing]
      summary: Subscribe to the free preview briefing series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /founding-offer:
    get:
      operationId: foundingOffer
      tags: [marketing]
      summary: Check a subscriber's founding-offer status
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Offer status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundingOfferStatus"
        "404":
          description: Unknown token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/status:
    get:
      operationId: publisherStatus
      tags: [publisher]
      summary: Publisher dashboard status (key-protected)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherStatus"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/draft:
    post:
      operationId: publisherDraft
      tags: [publisher]
      summary: Draft a condensed free-edition teaser from the full Wire text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherDraftInput"
      responses:
        "200":
          description: Drafted teaser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherDraftResult"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /publisher/send:
    post:
      operationId: publisherSend
      tags: [publisher]
      summary: Send the weekly free edition to all active subscribers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherSendInput"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublisherSendResult"
        "401":
          description: Bad key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    PublisherStatus:
      type: object
      required: [subscriberCount]
      properties:
        subscriberCount:
          type: number
        lastSentAt:
          type: string
        lastSubject:
          type: string
    PublisherDraftInput:
      type: object
      required: [key, wireText]
      properties:
        key:
          type: string
        wireText:
          type: string
          minLength: 100
    PublisherDraftResult:
      type: object
      required: [subject, bodyText]
      properties:
        subject:
          type: string
        bodyText:
          type: string
    PublisherSendInput:
      type: object
      required: [key, subject, bodyText]
      properties:
        key:
          type: string
        subject:
          type: string
          minLength: 3
        bodyText:
          type: string
          minLength: 50
    PublisherSendResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: number
    FoundingOfferStatus:
      type: object
      required: [active, deadline, deadlineLabel]
      properties:
        active:
          type: boolean
        deadline:
          type: string
        deadlineLabel:
          type: string
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
    SubscribeResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ApiMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

