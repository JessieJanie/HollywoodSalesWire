kind = "web"
previewPath = "/"
title = "Hollywood Sales Wire"
version = "1.0.0"
id = "artifacts/hollywood-sales-wire"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25128

[services.development]
run = "pnpm --filter @workspace/hollywood-sales-wire run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/hollywood-sales-wire", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/hollywood-sales-wire", "run", "serve"]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "25128"
BASE_PATH = "/"
